spring.application.name=transancciones

server.port= 8000

#Configuracion para la base de datos H2 en memoria 
spring.datasource.url=jdbc:h2:mem:transaccionesdb;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.h2.console.enabled=true