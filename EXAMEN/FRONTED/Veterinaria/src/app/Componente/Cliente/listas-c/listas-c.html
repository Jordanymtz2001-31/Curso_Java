<div class="container">
    <div class="card border-info mb-3 mt-1">
        <div class="card-header">
            <h2 class="text-center">LISTA DE CLIENTE</h2>
            <div class="container">
                <div class="card-body">
                    <table class="table table-hover">
                        <thead>
                            <tr>
                                <th scope="col">ID</th>
                                <th scope="col">NOMBRE</th>
                                <th scope="col">DIRECCION</th>
                                <th scope="col">CONTACTO</th>
                                <th scope="col">MAS</th>
                            </tr>
                        </thead>
                        <tbody>
                            @for (cliente of clientes; track cliente.idCliente) {
                            <tr>
                                <td>{{cliente.idCliente}}</td>
                                <td>{{cliente.nombre}}</td>
                                <td>{{cliente.direccion}}</td>
                                <td>{{cliente.contacto}}</td>
                                <td>
                                    <div class="nav-item dropdown">
                                        <button class="nav-link dropdown-toggle" type="button" (click)="toggleMenu('acciones-' + cliente.idCliente)">
                                            Opciones
                                        </button>
                                        <div class="dropdown-menu" [class.show]="isMenuOpen('acciones-' + cliente.idCliente)">
                                            <a class="dropdown-item" (click)="btnEditar(cliente.idCliente)">
                                                <span class="icon">✏️</span> Editar
                                            </a>
                                            <a class="dropdown-item" (click)="btnEliminar(cliente.idCliente)">
                                                <span class="icon">🗑️</span> Eliminar
                                            </a>
                                            <a class="dropdown-item" (click)="btnListMascota(cliente.idCliente)">
                                                <span class="icon">📦</span> Mascotas del Cliente
                                            </a>
                                        </div>
                                    </div>
                                </td>
                            </tr>
                            } @empty {
                            <td colspan="5" style="text-align: center;">No existen registros</td>
                            }
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>
</div>
