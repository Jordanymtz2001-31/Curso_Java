spring.application.name=Computadora

#Puerto en el que se subira mi aplicacion 
server.port=8001

#configuracion para conectarse a la base de datos
spring.datasource.url=jdbc:oracle:thin:@localhost:1522:XE
spring.datasource.username=system
spring.datasource.password=12345
spring.datasource.driver-class-name=oracle.jdbc.OracleDriver
spring.jpa.database=oracle
spring.jpa.database-platform=org.hibernate.dialect.OracleDialect
spring.jpa.properties.hibernate.formt-sql=true

logging.level.org.hibernate.SQL=DEBUG
logging.level.properties.type.descriptor.sql.BasicBinder=TRACE