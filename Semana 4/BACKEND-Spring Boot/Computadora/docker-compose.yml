services:
  oracle-db:
    image: gvenzl/oracle-xe:latest  # Versión específica más estable
    container_name: oracle-db
    ports:
      - '1522:1521'
    environment:
      - ORACLE_PASSWORD=12345
    restart: unless-stopped

  spring-app:
    image: computadora-spring:1.0
    container_name: spring-app
    ports:
      - '8080:8001'  # Correcto: host:container
    environment:
      - SPRING_DATASOURCE_URL=jdbc:oracle:thin:@oracle-db:1521:XE  # Puerto interno 1521
      - SPRING_DATASOURCE_USERNAME=system
      - SPRING_DATASOURCE_PASSWORD=12345
    depends_on:
      - oracle-db  # Espera que inicie DB primero
    restart: unless-stopped
