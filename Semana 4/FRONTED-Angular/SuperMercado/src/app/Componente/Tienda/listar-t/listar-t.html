<div class="container">
    <div class="card border-info mb-3 mt-1">
        <div class="card-header">
            <h2 class="text-center">LISTA DE TIENDAS</h2>
            <div class="container">

                <div class="card-body">
                    <table class="table table-hover">
                        <thead>
                            <tr>
                                <th scope="col">ID TIENDA</th>
                                <th scope="col">CODIGO</th>
                                <th scope="col">NOMBRE</th>
                                <th scope="col">DIRECCION</th>
                                <th scope="col">TIPO TIENDA</th>
                                <th scope="col">CIUDAD</th>
                                <th scope="col">ACCIONES</th>
                            </tr>
                        </thead>
                        <tbody>
                            @for (tienda of tiendas; track tienda.idTienda) {
                            <tr>
                                <td>{{tienda.idTienda}}</td>
                                <td>{{tienda.codigo}}</td>
                                <td>{{tienda.nombre}}</td>
                                <td>{{tienda.direccion}}</td>
                                <td>{{tienda.tipo}}</td>
                                <td>{{tienda.ciudad}}</td>
                                <td>
                                    <button type="button" class="btn btn-success" (click)="btnEditar(tienda.idTienda)">EDITAR</button>
                                    <button type="button" class="btn btn-danger" (click)="btnEliminar(tienda.idTienda)">ELIMINAR</button>
                                </td>
                            </tr>
                            } @empty {
                            <td colspan="5" style="text-align: center;">No existen registros</td>
                            }
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>
</div>
