    <div class="guardar-cliente-container">
        <div class="card">
            <div class="card-header">
                <h1>Editar Proveedor</h1>
                <p class="subtitle">Completa el formulario para editar el Proveedor</p>
            </div>
            
            <form class="cliente-form">
                <div class="form-row">
                    <div class="form-group">
                        <label for="id">ID</label>
                        <input type="number" id="id" name="id"  [(ngModel)]="proveedor.idProveedor" readonly>
                    </div>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label for="nombre">Nombre</label>
                        <input type="text" id="nombre" name="nombre"  [(ngModel)]="proveedor.nombreProveedor" required placeholder="Ingresa el Nombre">
                    </div>
                </div>
                <div class="form-row form-row-two">
                    <div class="form-group">
                        <label for="tipo">Tipo</label>
                        <input type="text" id="tipo" name="tipo"  [(ngModel)]="proveedor.tipo" required placeholder="Ingresa el Tipo">
                    </div>
                    <div class="form-group">
                        <label for="responsable">Responsable</label>
                        <input type="text" id="responsable" name="responsable" [(ngModel)]="proveedor.responsable" required placeholder="Ingresa el Responsable">
                    </div>
                    <div class="form-group">
                        <label for="telefono">Telefono</label>
                        <input type="number" id="telefono" name="telefono" [(ngModel)]="proveedor.telefono" required placeholder="Ej: 2331086911">
                    </div>
                    <div class="form-group">
                        <label for="direccion">Direccion</label>
                        <input type="text" id="direccion" name="direccion" [(ngModel)]="proveedor.direccion" required placeholder="Ingresa la Direccion">
                    </div>
                    <div class="form-group">
                        <label for="email">Email</label>
                        <input type="email" id="email" name="email" [(ngModel)]="proveedor.email" required placeholder="Ingresa tu Email">
                    </div>
                    <div class="form-group">
                        <label for="tiendaId">Tienda ID</label>
                        <input type="number" id="tiendaId" name="tiendaId" [(ngModel)]="proveedor.tiendaId" readonly>
                    </div>
                </div>

                <div class="form-actions">
                    <button type="submit" class="btn btn-primary" (click)="btnEditarProveedor()">
                        <span>✓ Guardar Tienda</span>
                    </button>
                </div>
            </form>
        </div>
    </div>
