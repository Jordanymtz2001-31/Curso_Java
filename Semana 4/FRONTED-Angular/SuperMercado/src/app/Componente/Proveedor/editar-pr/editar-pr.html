<div class="container py-5">
    <div class="card shadow-lg border-0 rounded-3">
        <div class="card-header bg-light text-center py-4">
            <h2 class="fw-bold text-center m-0">Editar Proveedor</h2>
        </div>
        <div class="card-body p-4">
            <form>
                <div class="mb-3">
                    <label for="id" class="form-label fw-semibold">ID:</label>
                    <input type="number" class="form-control form-control-lg shadow-sm" [(ngModel)]="proveedor.idProveedor" name="id" readonly>
                </div>
                <div class="mb-3">
                    <label for="nombre" class="form-label fw-semibold">Nombre:</label>
                    <input type="text" class="form-control form-control-lg shadow-sm" [(ngModel)]="proveedor.nombreProveedor" name="nombre">
                </div>
                <div class="mb-3">
                    <label for="tipo" class="form-label fw-semibold">Tipo:</label>
                    <input type="text" class="form-control form-control-lg shadow-sm" [(ngModel)]="proveedor.tipo" name="tipo">
                </div>
                <div class="mb-3">
                    <label for="responsable" class="form-label fw-semibold">Rresponsable:</label>
                    <input type="text" class="form-control form-control-lg shadow-sm" [(ngModel)]="proveedor.responsable" name="responsable" readonly>
                </div>
                <div class="mb-3">
                    <label for="telefono" class="form-label fw-semibold">Telefono:</label>
                    <input type="number" class="form-control form-control-lg shadow-sm" [(ngModel)]="proveedor.telefono" name="responsable" readonly>
                </div>
                <div class="d-flex justify-content-center mt-3">
                    <button type="button" class="btn btn-outline-warning shadow-sm px-4">
                        <i class="bi bi-pencil-square me-2"></i>Editar</button>
                </div>
            </form>
        </div>
    </div>
</div>
