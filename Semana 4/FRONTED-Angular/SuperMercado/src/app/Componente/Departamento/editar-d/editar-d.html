    <div class="guardar-cliente-container">
        <div class="card">
            <div class="card-header">
                <h1>Editar Departamento</h1>
                <p class="subtitle">Completa el formulario para editar una Departamento</p>
            </div>
            
            <form class="cliente-form">
                <div class="form-row">
                    <div class="form-group">
                        <label for="id">ID</label>
                        <input type="number" id="id" name="id"  [(ngModel)]="departamento.idDepartamento" readonly>
                    </div>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label for="nombre">Nombre</label>
                        <input type="text" id="nombre" name="nombre"  [(ngModel)]="departamento.nombre" required placeholder="Ingresa el nombre">
                    </div>
                </div>
                <div class="form-row form-row-two">
                    <div class="form-group">
                        <label for="codigo">Codigo</label>
                        <input type="text" id="codigo" name="codigo"  [(ngModel)]="departamento.codigo" required placeholder="Ingresa el codigo">
                    </div>
                    <div class="form-group">
                        <label for="descripcion">Descripcion</label>
                        <input type="text" id="descripcion" name="descripcion" [(ngModel)]="departamento.descripcion" required placeholder="Ingresa una Descripcion">
                    </div>
                    <div class="form-group">
                        <label for="telefono">Telefono</label>
                        <input type="number" id="telefono" name="telefono" [(ngModel)]="departamento.telefono" required placeholder="Ej: 2331086911">
                    </div>
                    <div class="form-group">
                        <label for="email">Email</label>
                        <input type="email" id="email" name="email" [(ngModel)]="departamento.email" required placeholder="Ej: 2331086911">
                    </div>
                </div>

                <div class="form-actions">
                    <button type="submit" class="btn btn-primary" (click)="btnEditarDepartamento()">
                        <span>✓ Editar Departamento</span>
                    </button>
                </div>
            </form>
        </div>
    </div>
