    <div class="guardar-cliente-container">
        <div class="card">
            <div class="card-header">
                <h1>Editar Empleado</h1>
                <p class="subtitle">Completa el formulario para editar un Empleado</p>
            </div>
            
            <form class="cliente-form">
                <div class="form-row">
                    <div class="form-group">
                        <label for="id">ID</label>
                        <input type="number" id="id" name="id"  [(ngModel)]="empleado.id" readonly>
                    </div>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label for="nombre">Nombre</label>
                        <input type="text" id="nombre" name="nombre"  [(ngModel)]="empleado.nombre" required placeholder="Ingresa el nombre">
                    </div>
                </div>
                <div class="form-row form-row-two">
                    <div class="form-group">
                        <label for="apelliodP">Apellido Paterno</label>
                        <input type="text" id="apelliodP" name="apellidoP"  [(ngModel)]="empleado.apellidoP" required placeholder="Ingresa el Apellido Paterno">
                    </div>
                    <div class="form-group">
                        <label for="apelliodM">Apellido Materno</label>
                        <input type="text" id="apelliodM" name="apellidoM"  [(ngModel)]="empleado.apellidoM" required placeholder="Ingresa el Apellido Materno">
                    </div>
                    <div class="form-group">
                        <label for="edad">Edad</label>
                        <input type="number" id="edad" name="edad" [(ngModel)]="empleado.edad" required placeholder="Ingresa la edad">
                    </div>
                    <div class="form-group">
                        <label for="telefono">Telefono</label>
                        <input type="number" id="telefono" name="telefono" [(ngModel)]="empleado.telefono" required placeholder="Eje: 2331086911">
                    </div>
                    <div class="form-group">
                        <label>Puesto:</label>
                            <select [(ngModel)]="empleado.puesto" name="puesto" class="form-control" required>
                            <option value="">Selecciona un tipo</option>
                            <option value="GERENTE">GERENTE</option>
                            <option value="SUBGERENTE">SUBGERENTE</option>
                            <option value="LIDER">LIDER</option>
                            <option value="AUXILIAR">AUXILIAR</option>
                            </select>
                    </div>
                    <div class="form-group">
                        <label for="depaId">Departamento ID</label>
                        <input type="number" id="depaId" name="depaId" [(ngModel)]="empleado.departamentoId" readonly>
                    </div>
                    <div class="form-group">
                        <label for="tiendaId">Tienda ID</label>
                        <input type="number" id="tiendaId" name="tiendaId" [(ngModel)]="empleado.tiendaId" readonly>
                    </div>
                </div>

                <div class="form-actions">
                    <button type="submit" class="btn btn-primary" (click)="btnEditarEmpleado()">
                        <span>✓ Editar Empleado</span>
                    </button>
                </div>
            </form>
        </div>
    </div>
