<div class="container">
    <div class="card border-info mb-3 mt-1">
        <div class="card-header">
            <h2 class="text-center">LISTA DE CLIENTE</h2>
            <div class="container">

                <div class="card-body">
                    <table class="table table-hover">
                        <thead>
                            <tr>
                                <th scope="col">#</th>
                                <th scope="col">ID CLIENTE</th>
                                <th scope="col">NOMBRE/th>
                                <th scope="col">APELLIDO P</th>
                                <th scope="col">APELLIDO M</th>
                                <th scope="col">TELEFONO</th>
                                <th scope="col">TIENDA ID</th>
                            </tr>
                        </thead>
                        <tbody>
                            @for (cliente of clientes; track cliente.idCliente) {
                            <tr>
                                <td>{{cliente.idCliente}}</td>
                                <td>{{cliente.nombre}}</td>
                                <td>{{cliente.apellidoP}}</td>
                                <td>{{cliente.apellidoM}}</td>
                                <td>{{cliente.telefono}}</td>
                                <td>{{cliente.tiendaId}}</td>
                                <td>
                                    <button type="button" class="btn btn-warning">EDITAR</button>
                                    <button type="button" class="btn btn-danger" (click)="btnEliminar(cliente.idCliente)">ELIMINAR</button>
                                </td>
                            </tr>
                            } @empty {
                            <td colspan="5" style="text-align: center;">No existen registros</td>
                            }
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>
</div>
