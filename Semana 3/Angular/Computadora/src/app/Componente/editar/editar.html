<div class="container py-5">
    <div class="card shadow-lg border-0 rounded-3">
        <div class="card-header bg-light text-center py-4">
            <h2 class="fw-bold text-center m-0">Editar Computadora</h2>
        </div>
        <div class="card-body p-4">
            <form>
                <div class="mb-3">
                    <label for="id" class="form-label fw-semibold">ID:</label>
                    <input type="number" class="form-control form-control-lg shadow-sm" [(ngModel)]="computadora.idCompu" name="id" readonly>
                </div>
                <div class="mb-3">
                    <label for="marca" class="form-label fw-semibold">Marca:</label>
                    <input type="text" class="form-control form-control-lg shadow-sm" [(ngModel)]="computadora.marca" name="marca">
                </div>
                <div class="mb-3">
                    <label for="modelo" class="form-label fw-semibold">Modelo:</label>
                    <input type="text" class="form-control form-control-lg shadow-sm" [(ngModel)]="computadora.modelo" name="modelo">
                </div>
                <div class="mb-3">
                    <label for="ram" class="form-label fw-semibold">Ram:</label>
                    <input type="number" class="form-control form-control-lg shadow-sm" [(ngModel)]="computadora.ram" name="ram">
                </div>
                <div class="mb-3">
                    <label for="procesador" class="form-label fw-semibold">Procesador:</label>
                    <input type="text" class="form-control form-control-lg shadow-sm" [(ngModel)]="computadora.procesador" name="procesador">
                </div>
                <div class="mb-3">
                    <label for="precio" class="form-label fw-semibold">Precio:</label>
                    <input type="text" class="form-control form-control-lg shadow-sm" [(ngModel)]="computadora.precio" name="precio">
                </div>
                <div class="d-flex justify-content-center mt-3">
                    <button type="button" class="btn btn-outline-warning shadow-sm px-4" (click)="editar()">
                        <i class="bi bi-pencil-square me-2"></i>Editar</button>
                    <button type="button" class="btn btn-primary btn-lg px-4" (click)="cancelar()">
                        <i class="bi bi-x-circle me-2"></i>Cancelar</button>
                </div>
            </form>
        </div>
    </div>
</div>
