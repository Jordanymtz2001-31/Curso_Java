<div class="container">
    <div class="card">
        <div class="card-header">
            <h1>Lista de Computadoras</h1>
        </div>
        <table class="table table-hover">
            <thead >
                <tr >
                    <th scope="col" >ID</th>
                    <th scope="col" >MARCA</th>
                    <th scope="col" >MODELO</th>
                    <th scope="col" >RAM</th>
                    <th scope="col" >PROCESADOR</th>
                    <th scope="col" >PRECIO</th>
                    <th scope="col" >ACCIONES</th>
                </tr>
            </thead>
            <tbody >
                <!-- computadora es la entidad-->
                @for (computadora of listaComputadoras; track computadora.idCompu){
                    <tr class="table-active" >
                        <th>{{computadora.idCompu}}</th>
                        <td >{{computadora.marca}}</td>
                        <td >{{computadora.modelo}}</td>
                        <td >{{computadora.ram}}</td>
                        <td >{{computadora.procesador}}</td>
                        <td >${{computadora.precio}}</td>
                        <td >
                            <div class="btn-group" role="group" aria-label="Basic example">
                                <button class="button" class="btn btn-info"class="btn btn-info" (click)="editarCompu(computadora.idCompu)">Editar</button>
                                <button class="button" class="btn btn-primary" (click)="eliminarComputadora(computadora.idCompu)">Eliminar</button>
                            </div>
                        </td>
                    </tr>
                }
            </tbody>
        </table>
    </div>
</div>
